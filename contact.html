<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connecting...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const action = params.get('action');
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (action === 'phone') {
      // Phone: open the dialer. Computer: go to the contact section.
      window.location.href = isMobile ? 'tel:+8801782455819' : './#contact';
    } else if (action === 'email') {
      // Phone: open the mail app. Computer: open Gmail compose.
      window.location.href = isMobile
        ? 'mailto:smmohibulabrar@gmail.com'
        : 'https://mail.google.com/mail/?view=cm&fs=1&to=smmohibulabrar@gmail.com';
    } else {
      window.location.href = './#contact';
    }
  </script>
</head>
<body style="background:#020617;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Connecting...</p>
</body>
</html>
